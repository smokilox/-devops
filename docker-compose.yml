services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: alpine_club_app
    environment:
      APP_ENV: production
      APP_VERSION: 0.1.0
      DATABASE_URL: sqlite:////app/data/alpine.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - alpine-network

networks:
  alpine-network:
    driver: bridge
